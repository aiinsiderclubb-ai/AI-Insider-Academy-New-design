<!--
  Чат-виджет для сайта: кнопка в правом нижнем углу и окно переписки с агентом.
  Вставьте весь блок перед </body>. Замените ENDPOINT (Production URL узла Webhook)
  и TOKEN (agent_token из Config).

  Токен виден в коде страницы: он отсекает случайные запросы, но не секрет.
  Бюджет защищают лимиты из Config (rate_limit_*, daily_agent_runs).
  Подробно — docs/03-channels.md.
-->
<style>
  #sa-launcher { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: #111827; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 9998; }
  #sa-box { position: fixed; right: 20px; bottom: 88px; width: min(360px, calc(100vw - 40px)); height: min(520px, calc(100vh - 120px));
    display: none; flex-direction: column; background: #fff; color: #111827; border-radius: 14px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); font: 15px/1.45 system-ui, sans-serif; z-index: 9999; }
  #sa-box.open { display: flex; }
  #sa-head { padding: 12px 16px; background: #111827; color: #fff; font-weight: 600; }
  #sa-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #f9fafb; }
  .sa-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .sa-me { align-self: flex-end; background: #111827; color: #fff; }
  .sa-bot { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; }
  .sa-note { align-self: center; color: #6b7280; font-size: 13px; }
  #sa-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
  #sa-input { flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 10px; padding: 8px 10px; font: inherit; }
  #sa-send { border: 0; border-radius: 10px; padding: 0 14px; background: #111827; color: #fff; cursor: pointer; }
  #sa-send:disabled { opacity: .5; cursor: default; }
</style>
<button id="sa-launcher" aria-label="Открыть чат поддержки">💬</button>
<div id="sa-box" role="dialog" aria-label="Чат поддержки">
  <div id="sa-head">Подбор недвижимости</div>
  <div id="sa-log" aria-live="polite"></div>
  <form id="sa-form">
    <textarea id="sa-input" rows="2" maxlength="2000" placeholder="Ваш вопрос" required></textarea>
    <button id="sa-send" type="submit">→</button>
  </form>
</div>
<script>
(function () {
  var ENDPOINT = 'https://REPLACE-N8N-HOST/webhook/realty-agent';
  var TOKEN = 'REPLACE_WITH_AGENT_TOKEN';
  var GREETING = 'Здравствуйте! Расскажите, что ищете: покупка или аренда, район, бюджет — подберу варианты.';

  var box = document.getElementById('sa-box');
  var log = document.getElementById('sa-log');
  var form = document.getElementById('sa-form');
  var input = document.getElementById('sa-input');
  var send = document.getElementById('sa-send');

  function sessionId() {
    try {
      var id = localStorage.getItem('sa-session');
      if (!id) {
        id = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('sa-session', id);
      }
      return id;
    } catch (e) {
      return window.__saSession || (window.__saSession = 's-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    }
  }

  function add(text, who) {
    var el = document.createElement('div');
    el.className = 'sa-msg ' + (who === 'me' ? 'sa-me' : who === 'note' ? 'sa-note' : 'sa-bot');
    el.textContent = text; // только текст: ответ модели не вставляется как HTML
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('sa-launcher').addEventListener('click', function () {
    box.classList.toggle('open');
    if (box.classList.contains('open')) {
      if (!log.children.length) add(GREETING, 'bot');
      input.focus();
    }
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    add(text, 'me');
    input.value = '';
    send.disabled = true;
    // token в теле, а не в заголовке: так браузер не делает лишний preflight-запрос
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, session_id: sessionId(), message: text })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        add(data.reply || 'Не получилось ответить. Попробуйте ещё раз чуть позже.', 'bot');
        if (data.handoff) add('Диалог передан менеджеру', 'note');
      })
      .catch(function () { add('Нет связи с сервером. Попробуйте ещё раз чуть позже.', 'note'); })
      .finally(function () { send.disabled = false; input.focus(); });
  });
})();
</script>
